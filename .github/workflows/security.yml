name: Database security tests
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node scripts/download-emulator.cjs
      - name: Exercise database rules in an isolated local emulator
        shell: bash
        run: |
          java -jar test-results/emulator/firestore.jar --host 127.0.0.1 --port 8180 --rules firestore.rules --project_id demo-tracklist-security --single_project_mode true > test-results/emulator/output.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8180/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:rules
